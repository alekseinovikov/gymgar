name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or pull request makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing OS must not hide the result of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The system libraries egui/winit build against on Linux. `keyring` reaches the Secret Service through pure-Rust
      # zbus, so `libdbus-1-dev` is not needed. If the build asks for another package, add it here.
      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # fmt --check, clippy -D warnings, test --workspace and the layering check: the same gate as on a developer's machine.
      - run: cargo xtask ci
