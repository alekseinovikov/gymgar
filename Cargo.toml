[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# internal
gymgar-domain = { path = "crates/domain" }
gymgar-garmin = { path = "crates/garmin" }
gymgar-secrets = { path = "crates/secrets" }
gymgar-store = { path = "crates/store" }
gymgar-sync = { path = "crates/sync" }
gymgar-engine = { path = "crates/engine" }
gymgar-ui-egui = { path = "crates/ui-egui" }
gymgar-automation = { path = "crates/automation" }

# external
eframe = { version = "0.37", features = ["persistence"] }
egui = "0.37"
egui_kittest = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# System secret store (Keychain / Credential Manager / Secret Service) for the Garmin API key.
keyring = "4.2"
# Secrets never reach Debug/Display/logs; `serde` lets other crates deserialize them (never serialize).
secrecy = { version = "0.10", features = ["serde"] }
tempfile = "3"
# HTTP client for the Garmin APIs (rustls by default). Add features only when a call needs them.
reqwest = "0.13"
# Garmin calls run off the UI thread; every crate enables just the tokio features it uses.
tokio = { version = "1.54", default-features = false }
# Decodes the JWT payload in garmin::personal::jwt.
base64 = "0.23"
# Local mock server for Garmin API tests (tests never reach the real Garmin).
wiremock = "0.6"
# SQLite for gymgar-store; `bundled` compiles SQLite into the app so it never depends on a system library.
rusqlite = { version = "0.40", features = ["bundled"] }
# Per-OS user data directory (where the database and the file secret store live).
directories = "6"
# JSON Schema of command parameters: the same schema feeds MCP `inputSchema`, docs and UI forms.
schemars = "1.2"
# Background jobs are boxed futures run on an injected spawner; `executor` runs them inline in engine test doubles.
futures = "0.3"
# Official MCP SDK for gymgar-automation. Crates enable only the features they use (`server`, `transport-io`; `client` in tests).
rmcp = { version = "3.7", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

# Never crash: non-test code returns errors instead of panicking (CLAUDE.md › Never crash).
# clippy.toml relaxes these inside tests only.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"

[profile.dev]
opt-level = 1
# Keeps file:line in panic backtraces, roughly halves link time. For locals in a debugger:
# CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# egui/wgpu are sluggish unoptimized; our own crates stay fast to compile.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
