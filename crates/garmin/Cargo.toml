[package]
name = "gymgar-garmin"
description = "Garmin Connect client: Personal API for activities, web API for workouts (standalone)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `fit::testing`: a FIT writer and a one-file ZIP writer, for the tests of crates that read activity files (synthetic files,
# scrubbed fixtures). Apps never enable it.
testing = []

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
fitparser = { workspace = true }
# Only selects zip's deflate backend.
flate2 = { workspace = true }
log = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Only the async mutex that guards the token cache.
tokio = { workspace = true, features = ["sync"] }
zip = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
